services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sitetrack
      POSTGRES_PASSWORD: sitetrack
      POSTGRES_DB: sitetrack
    command: postgres -c shared_buffers=512MB -c work_mem=16MB -c maintenance_work_mem=256MB -c random_page_cost=1.1 -c effective_cache_size=2GB -c jit=off
    ports:
      - "54330:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitetrack -d sitetrack"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgres://sitetrack:sitetrack@db:5432/sitetrack
      JWT_SECRET: change-me-in-production
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
